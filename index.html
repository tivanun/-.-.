<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบติดตามผลการดำเนินงานของหน่วยงาน</title>
<style>
:root{--navy:#17365d;--blue:#2463a6;--blue2:#eaf2fb;--ink:#1e293b;--muted:#68778b;--line:#e3e9f0;--bg:#f5f7fa;--white:#fff;--green:#15803d;--greenbg:#eaf7ee;--amber:#9a6700;--amberbg:#fff5d6;--red:#b42318;--redbg:#fff0ee;--shadow:0 8px 24px rgba(27,53,87,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans Thai",Tahoma,Arial,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#102d50;color:#eaf1f8;padding:24px 15px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;padding:0 10px 26px;border-bottom:1px solid #ffffff22}.brandmark{width:42px;height:42px;border-radius:13px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:20px}.brand b{display:block;font-size:15px}.brand small{color:#b9cadc}.navlabel{margin:24px 12px 8px;color:#90a8c2;font-size:11px;letter-spacing:.07em}.nav button{width:100%;border:0;background:none;color:#cfdae7;text-align:left;padding:11px 12px;margin:2px 0;border-radius:9px;font:inherit;cursor:pointer;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:#ffffff16;color:#fff}.nav button.active{box-shadow:inset 3px 0 #77b8ff}.ico{width:20px;text-align:center;font-size:17px}.sidefoot{margin-top:auto;border-top:1px solid #ffffff22;padding:17px 10px 0;color:#bfd0e1;font-size:12px}.main{min-width:0}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:4}.crumb{font-size:13px;color:var(--muted)}.topright{display:flex;align-items:center;gap:12px}.role{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;color:var(--ink);font:inherit}.avatar{width:36px;height:36px;border-radius:50%;background:#eaf2fb;color:var(--navy);display:grid;place-items:center;font-weight:700}.content{max-width:1450px;margin:0 auto;padding:30px 34px 54px}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:23px}.heading h1{font-size:25px;margin:0 0 5px;color:#132f50}.heading p{margin:0;color:var(--muted)}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;white-space:nowrap}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:hover{filter:brightness(.97)}.monthbox{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px}.monthbox label{color:var(--muted);font-size:13px}.monthbox input{border:0;outline:0;font:inherit;color:var(--navy);font-weight:700}.cards{display:grid;grid-template-columns:repeat(5,minmax(135px,1fr));gap:13px;margin:20px 0}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px 18px;box-shadow:var(--shadow)}.cardtop{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}.cardicon{width:31px;height:31px;border-radius:9px;background:var(--blue2);color:var(--blue);display:grid;place-items:center}.number{font-size:29px;font-weight:750;line-height:1.2;margin:13px 0 6px;color:#152f4b}.sub{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(285px,.8fr);gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel h2{font-size:16px;margin:0;color:#193553}.panel .hint{font-size:12px;color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;color:#64748b;background:#f7f9fc;font-weight:600;font-size:12px;padding:11px 12px;white-space:nowrap}td{padding:12px;border-bottom:1px solid #edf0f4;font-size:13px}tr:last-child td{border-bottom:0}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 9px;font-size:11px;font-weight:650;white-space:nowrap}.pill:before{content:"";width:6px;height:6px;border-radius:100%;background:currentColor}.pill.green{background:var(--greenbg);color:var(--green)}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.red{background:var(--redbg);color:var(--red)}.pill.blue{background:var(--blue2);color:var(--blue)}.empty{padding:26px;text-align:center;color:var(--muted)}.empty b{display:block;color:#354b64;margin-bottom:3px}.barrow{display:grid;grid-template-columns:115px 1fr 38px;gap:10px;align-items:center;margin:14px 0;font-size:12px}.track{height:9px;background:#edf2f7;border-radius:8px;overflow:hidden}.fill{height:100%;border-radius:8px;background:#4787c6}.checkrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #edf0f4;font-size:13px}.checkrow:last-child{border:0}.sectiontabs{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px;overflow:auto}.tab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font:inherit;color:#41536a;cursor:pointer;white-space:nowrap}.tab.active{background:var(--blue2);border-color:#bad4ef;color:var(--blue);font-weight:700}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:650;color:#364a62}.field input,.field select,.field textarea{width:100%;border:1px solid #d7dfe8;border-radius:8px;padding:10px 11px;font:inherit;background:#fff;color:var(--ink)}.field textarea{min-height:85px;resize:vertical}.field small{color:var(--muted);font-size:11px}.formactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.notice{padding:12px 14px;border-radius:9px;background:#fff7e6;border:1px solid #f3dfae;color:#745300;font-size:12px;margin:12px 0 17px}.safe{display:flex;gap:8px;padding:12px;border-radius:9px;background:#eff8f2;color:#28663d;font-size:12px;margin-bottom:16px}.chartlegend{display:flex;gap:16px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4787c6;margin-right:6px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 11px;font:inherit}.muted{color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;right:22px;bottom:22px;background:#17365d;color:white;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;z-index:10}.toast.show{opacity:1;transform:translateY(0)}.mobilemenu{display:none;background:none;border:0;font-size:22px;color:var(--navy)}
@media(min-width:1051px){.cards{grid-template-columns:repeat(6,minmax(115px,1fr))}}
.brandmark img{display:block;width:100%;height:100%;object-fit:contain}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);overflow:auto}.cal-head{background:#f4f7fb;color:#50627a;font-size:12px;font-weight:700;text-align:center;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.cal-day{min-height:130px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}.cal-day.off{background:#f8fafc}.cal-num{font-size:12px;font-weight:700;color:#39516d;margin-bottom:6px}.cal-day.off .cal-num{color:#a5afbb}.cal-event{background:#eaf2fb;border-left:3px solid #4787c6;border-radius:5px;padding:5px 6px;margin:4px 0;color:#183b61;font-size:11px;line-height:1.45}.cal-event b{display:block;font-size:11px}.cal-event small{color:#586d84}.calendar-tools{display:flex;gap:7px}
@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.content{padding:24px}.app{grid-template-columns:220px 1fr}}
@media(max-width:720px){.app{display:block}.side{position:fixed;left:-270px;top:0;bottom:0;width:250px;z-index:8;transition:left .2s}.side.open{left:0}.topbar{height:62px;padding:0 16px}.mobilemenu{display:block}.crumb{display:none}.content{padding:21px 15px 38px}.heading{display:block}.heading .actions{margin-top:14px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:14px}.number{font-size:25px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.topright{gap:7px}.role{max-width:156px;font-size:12px;padding:8px}.heading h1{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="sidebar"><div class="brand"><div class="brandmark"><img src="กพร.สป.png" alt="โลโก้หน่วยงาน"></div><div><b>ระบบติดตามผลการดำเนินงานของหน่วยงาน</b><small>รายงานประจำเดือน</small></div></div>
<div class="navlabel">ภาพรวม</div><nav class="nav">
<button class="active" data-page="dashboard"><span class="ico">▦</span>สรุปรายเดือน</button>
<div class="navlabel">แบบรับข้อมูล</div>
<button data-page="materials"><span class="ico">▤</span>เบิกวัสดุ</button><button onclick="materialView='catalog';setPage('materials')"><span class="ico">＋</span>เพิ่มรายการวัสดุ</button><button data-page="repairs"><span class="ico">⚒</span>แจ้งซ่อมอุปกรณ์</button><button data-page="services"><span class="ico">◎</span>บริการ/คำปรึกษา</button><button data-page="equipment"><span class="ico">⇄</span>ยืม–คืนครุภัณฑ์</button><button data-page="assetReport"><span class="ico">▧</span>รายงานครุภัณฑ์</button><button data-page="travel"><span class="ico">↗</span>ไปราชการ</button><button data-page="books"><span class="ico">▤</span>ทะเบียนหนังสือรับ–ส่ง</button><button data-page="duties"><span class="ico">☷</span>ตารางลำดับเวร</button>
<div class="navlabel">ข้อมูลจำกัดสิทธิ์</div>
<button data-page="leave"><span class="ico">◷</span>บันทึกการลา</button><button data-page="complaints"><span class="ico">▱</span>ร้องเรียน/ร้องทุกข์</button>
</nav><div class="sidefoot">ต้นแบบหน้าระบบ · ข้อมูลตัวอย่าง<br>สำหรับนำไปพัฒนาต่อบน WordPress</div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobilemenu" id="menuBtn">☰</button><span class="crumb">ระบบงานภายใน　/　<span id="crumb">สรุปรายเดือน</span></span></div><div class="topright"><select class="role" id="role"><option value="staff">มุมมอง: ผู้รับผิดชอบ</option><option value="employee">มุมมอง: บุคลากร</option><option value="hr">มุมมอง: งานบุคคล / จำกัดสิทธิ์</option></select><div class="avatar">ผ</div></div></header><div class="content" id="content"></div></main></div>
<div class="toast" id="toast"></div>
<script>
const thMonths=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const now=new Date();let selectedMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;let page='dashboard';let materialView='request';let repairRows=[];let serviceRows=[];let requestRows=[];let issuedRows=[];let stockItems=[{name:'กระดาษ A4',unit:'รีม',qty:24,min:5},{name:'ปากกาลูกลื่นสีน้ำเงิน',unit:'ด้าม',qty:60,min:10},{name:'แฟ้มเอกสาร',unit:'เล่ม',qty:18,min:5}];
let assetItems=[{id:'EQ-001',code:'กพร-2564-001',year:2564,name:'เครื่องพิมพ์เลเซอร์',category:'เครื่องใช้สำนักงาน',model:'M404dn',brand:'HP',price:19000,life:5,salvage:0,location:'ห้องธุรการ',status:'พร้อมใช้งาน'},{id:'EQ-002',code:'กพร-2565-002',year:2565,name:'โปรเจกเตอร์',category:'โสตทัศนูปกรณ์',model:'EB-X06',brand:'Epson',price:22000,life:5,salvage:0,location:'ห้องประชุม',status:'พร้อมใช้งาน'},{id:'EQ-003',code:'กพร-2566-003',year:2566,name:'คอมพิวเตอร์ตั้งโต๊ะ',category:'คอมพิวเตอร์',model:'OptiPlex 7000',brand:'Dell',price:26000,life:5,salvage:0,location:'ห้องงานบุคคล',status:'พร้อมใช้งาน'},{id:'EQ-004',code:'กพร-2565-004',year:2565,name:'กล้องถ่ายภาพ',category:'โสตทัศนูปกรณ์',model:'EOS 2000D',brand:'Canon',price:17500,life:5,salvage:0,location:'ห้องประชาสัมพันธ์',status:'พร้อมใช้งาน'},{id:'EQ-005',code:'กพร-2563-005',year:2563,name:'เครื่องสำรองไฟ',category:'เครื่องใช้สำนักงาน',model:'Back-UPS 1100',brand:'APC',price:10000,life:5,salvage:0,location:'ห้องธุรการ',status:'ส่งซ่อม'}];
let equipmentLoans=[{id:'LN-001',assetId:'EQ-002',borrower:'บุคลากรตัวอย่าง',dept:'งานประชาสัมพันธ์',loanDate:'2026-10-15',dueDate:'2026-10-22',returnedOn:''},{id:'LN-002',assetId:'EQ-004',borrower:'บุคลากรตัวอย่าง',dept:'งานธุรการ',loanDate:'2026-10-02',dueDate:'2026-10-05',returnedOn:'2026-10-05'}];
let travelRows=[];let bookRows=[];const workGroups=['กลุ่มนโยบาย โครงสร้างและระบบงาน','กลุ่มงานประเมินคุณภาพองค์กร','ฝ่ายบริหารงานทั่วไป'];let dutyRoster=[];let dutyRows=[];let dutyCursor=0;let dutyView='calendar';
const sample={materials:6,qty:34,repairs:4,repairDone:2,service:12,onsite:8,online:4,leave:7,complaints:1};
function monthLabel(v=selectedMonth){const [y,m]=v.split('-').map(Number);return `${thMonths[m-1]} ${y+543}`}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.querySelector('#sidebar').classList.remove('open');render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
document.addEventListener('input',e=>{if(['assetPrice','assetLife','assetSalvage','assetYear'].includes(e.target.id))previewAssetDep()});
document.addEventListener('change',e=>{if(e.target.id==='bookTypeFilter'){document.querySelectorAll('#content .panel:last-child tbody tr').forEach(r=>{r.style.display=e.target.value==='all'||r.innerText.includes(e.target.value)?'':'none'})}});
document.querySelector('#menuBtn').onclick=()=>document.querySelector('#sidebar').classList.toggle('open');
document.querySelector('#role').addEventListener('change',e=>{const v=e.target.value;if((page==='leave'||page==='complaints')&&v!=='hr'){toast('ข้อมูลหมวดนี้แสดงเฉพาะมุมมองงานบุคคล');e.target.value='hr';return}if(v==='employee'&&page==='materials')materialView='request';render()});
function heading(title,sub,tools=''){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div>${tools}</div>`}
function monthPicker(){return `<div class="monthbox"><label for="month">เดือนรายงาน</label><input type="month" id="month" value="${selectedMonth}"></div>`}
function statusPill(t,kind){return `<span class="pill ${kind}">${t}</span>`}
function dashboard(){let c={...sample,travel:travelRows.filter(t=>t.start.startsWith(selectedMonth)).length,duties:dutyRows.filter(d=>d.date.startsWith(selectedMonth)).length};if(requestRows.length||issuedRows.length)c.materials=issuedRows.length||sample.materials;if(repairRows.length)c.repairs=repairRows.length;if(serviceRows.length)c.service=serviceRows.length;
return `${heading('สรุปรายงานประจำเดือน','ภาพรวมผลการดำเนินงานของหน่วยงาน',monthPicker())}
<div class="cards"><div class="card"><div class="cardtop">เบิกวัสดุ <span class="cardicon">▤</span></div><div class="number">${c.materials}</div><div class="sub">รายการจ่าย · ${c.qty} ชิ้น</div></div><div class="card"><div class="cardtop">แจ้งซ่อม <span class="cardicon">⚒</span></div><div class="number">${c.repairs}</div><div class="sub">ดำเนินการเสร็จ ${c.repairDone} รายการ</div></div><div class="card"><div class="cardtop">บริการ/คำปรึกษา <span class="cardicon">◎</span></div><div class="number">${c.service}</div><div class="sub">ที่สถานที่ ${c.onsite} · ออนไลน์ ${c.online}</div></div><div class="card"><div class="cardtop">การลา <span class="cardicon">◷</span></div><div class="number">${c.leave}</div><div class="sub">รายการลา · ดูรายละเอียดได้เฉพาะงานบุคคล</div></div><div class="card"><div class="cardtop">ร้องเรียน/ร้องทุกข์ <span class="cardicon">▱</span></div><div class="number">${c.complaints}</div><div class="sub">เรื่องรับเข้า · รายละเอียดจำกัดสิทธิ์</div></div><div class="card"><div class="cardtop">ไปราชการ <span class="cardicon">↗</span></div><div class="number">${c.travel}</div><div class="sub">รายการเดินทางในเดือนนี้</div></div><div class="card"><div class="cardtop">ตารางลำดับเวร <span class="cardicon">☷</span></div><div class="number">${c.duties}</div><div class="sub">กิจกรรมที่จัดเวรในเดือนนี้</div></div></div>
<div class="layout"><section><div class="panel"><div class="panelhead"><h2>ผลรายงานแต่ละหมวด</h2><span class="hint">${monthLabel()}</span></div><div class="tablewrap"><table><thead><tr><th>หมวดงาน</th><th>จำนวน</th><th>สถานะประจำเดือน</th><th>ข้อมูลสรุป</th></tr></thead><tbody><tr><td>เบิกวัสดุ</td><td>${c.materials}</td><td>${statusPill('มีรายการ','green')}</td><td>${c.qty} ชิ้น</td></tr><tr><td>แจ้งซ่อมอุปกรณ์</td><td>${c.repairs}</td><td>${statusPill('มีรายการ','green')}</td><td>เสร็จแล้ว ${c.repairDone} รายการ</td></tr><tr><td>บริการ/คำปรึกษา</td><td>${c.service}</td><td>${statusPill('มีรายการ','green')}</td><td>ณ สถานที่ ${c.onsite} · ออนไลน์ ${c.online}</td></tr><tr><td>การลา</td><td>${c.leave}</td><td>${statusPill('มีรายการ','green')}</td><td>ประเภทการลาแยกดูในงานบุคคล</td></tr><tr><td>ร้องเรียน/ร้องทุกข์</td><td>${c.complaints}</td><td>${statusPill('มีรายการ','green')}</td><td>รายละเอียดจำกัดสิทธิ์</td></tr></tbody></table></div></div>

function materials(){let isEmployee=document.querySelector('#role').value==='employee';if(isEmployee)materialView='request';if(materialView==='catalog')return `${heading('รายการวัสดุ','เพิ่มและดูทะเบียนวัสดุ พร้อมหน่วยนับและยอดคงเหลือ')}<div class="panel"><div class="panelhead"><h2>เพิ่มรายการวัสดุ</h2><span class="hint">รายการใหม่จะแสดงในแบบฟอร์มขอเบิก</span></div><div class="formgrid"><div class="field"><label>ชื่อวัสดุ *</label><input id="newMatName" placeholder="เช่น หมึกพิมพ์"></div><div class="field"><label>หน่วยนับ *</label><input id="newMatUnit" placeholder="เช่น กล่อง, ชิ้น, รีม"></div><div class="field"><label>ยอดคงเหลือเริ่มต้น</label><input id="newMatQty" type="number" min="0" value="0"></div><div class="field"><label>แจ้งเตือนเมื่อเหลือต่ำกว่า</label><input id="newMatMin" type="number" min="0" value="0"></div></div><div class="formactions"><button class="btn primary" onclick="addMaterial()">เพิ่มรายการวัสดุ</button></div></div><div class="panel"><div class="panelhead"><h2>ทะเบียนวัสดุ</h2><span class="hint">${stockItems.length} รายการ</span></div><div class="tablewrap"><table><thead><tr><th>ชื่อวัสดุ</th><th>หน่วยนับ</th><th>คงเหลือ</th><th>จุดแจ้งเตือน</th><th>สถานะ</th></tr></thead><tbody>${stockItems.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td>${x.qty}</td><td>${x.min}</td><td>${x.qty<=x.min?statusPill('ควรตรวจสต็อก','amber'):statusPill('พร้อมเบิก','green')}</td></tr>`).join('')}</tbody></table></div></div>`;let subtabs=isEmployee?'':`<div class="sectiontabs"><button class="tab ${materialView==='request'?'active':''}" onclick="materialView='request';render()">คำขอจากบุคลากร</button><button class="tab ${materialView==='issue'?'active':''}" onclick="materialView='issue';render()">บันทึกจ่ายวัสดุ</button><button class="tab ${materialView==='list'?'active':''}" onclick="materialView='list';render()">รายการทั้งหมด</button><button class="tab" onclick="materialView='catalog';render()">เพิ่มรายการวัสดุ</button></div>`;
let form=materialView==='request'?`<div class="panel"><div class="panelhead"><h2>แบบคำขอเบิกวัสดุ</h2><span class="hint">สำหรับบุคลากร</span></div><div class="formgrid"><div class="field"><label>ชื่อผู้เบิก *</label><input id="mname" placeholder="ชื่อ นามสกุล"></div><div class="field"><label>หน่วยงาน/ฝ่าย *</label><input id="mdept" placeholder="ระบุหน่วยงาน"></div><div class="field"><label>รายการวัสดุ *</label><input id="mitem" placeholder="เช่น กระดาษ A4"></div><div class="field"><label>จำนวนที่ขอ *</label><input id="mqty" type="number" min="1" placeholder="0"></div><div class="field full"><label>วัตถุประสงค์</label><textarea id="mreason" placeholder="ระบุการใช้งาน"></textarea></div></div><div class="formactions"><button class="btn" onclick="toast('ล้างแบบฟอร์มแล้ว')">ล้างข้อมูล</button><button class="btn primary" onclick="addRequest()">ส่งคำขอเบิก</button></div></div>`:materialView==='issue'?`<div class="panel"><div class="panelhead"><h2>บันทึกการจ่ายวัสดุ</h2><span class="hint">กรอกจำนวนที่จ่ายจริง</span></div><div class="formgrid"><div class="field"><label>รหัสคำขอ (ถ้ามี)</label><input id="iref" placeholder="เช่น MAT-0001"></div><div class="field"><label>วันที่จ่าย *</label><input id="idate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>รายการวัสดุ *</label><input id="iitem" placeholder="รายการที่จ่าย"></div><div class="field"><label>จำนวนที่จ่าย *</label><input id="iqty" type="number" min="1" placeholder="0"></div><div class="field"><label>ผู้เบิก</label><input id="irecipient" placeholder="ชื่อผู้รับวัสดุ"></div><div class="field"><label>ผู้บันทึก *</label><input id="iclerk" placeholder="ชื่อผู้บันทึก"></div></div><div class="formactions"><button class="btn primary" onclick="addIssue()">บันทึกการจ่าย</button></div></div>`:`<div class="panel"><div class="panelhead"><h2>รายการวัสดุ</h2><span class="hint">คำขอและยอดจ่ายแยกกัน</span></div><div class="tablewrap"><table><thead><tr><th>วันที่</th><th>รายการ</th><th>ผู้เบิก/รับ</th><th>จำนวน</th><th>สถานะ</th></tr></thead><tbody>${[...issuedRows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.item)}</td><td>${esc(x.name)}</td><td>${esc(x.qty)}</td><td>${statusPill('จ่ายแล้ว','green')}</td></tr>`),...requestRows.map(x=>`<tr><td>วันนี้</td><td>${esc(x.item)}</td><td>${esc(x.name)}</td><td>${esc(x.qty)} (ขอ)</td><td>${statusPill('รออนุมัติ','amber')}</td></tr>`)].join('')||'<tr><td colspan="5" class="empty">ยังไม่มีรายการที่บันทึกในรอบนี้</td></tr>'}</tbody></table></div></div>`;
return `${heading('เบิกวัสดุ','บุคลากรส่งคำขอ และผู้รับผิดชอบบันทึกยอดจ่ายจริง')}<div class="notice">ยอดในรายงานคำนวณจากรายการจ่ายจริง คำขอที่ยังไม่จ่ายจะแสดงเป็นรายการรอดำเนินการ</div>${subtabs}${form}`}
function repairs(){return `${heading('แจ้งซ่อมอุปกรณ์','บุคลากรส่งเรื่องติดตามได้ ผู้รับผิดชอบอัปเดตสถานะและแนบรายงานผล')}<div class="sectiontabs"><button class="tab active" onclick="document.querySelector('#repairForm').classList.remove('hidden');document.querySelector('#repairList').classList.add('hidden')">แจ้งซ่อม</button><button class="tab" onclick="document.querySelector('#repairForm').classList.add('hidden');document.querySelector('#repairList').classList.remove('hidden')">ติดตาม/อัปเดตงาน</button></div><div class="panel" id="repairForm"><div class="panelhead"><h2>แบบแจ้งซ่อม</h2><span class="hint">กรอกข้อมูลอุปกรณ์และอาการ</span></div><div class="formgrid"><div class="field"><label>ผู้แจ้ง *</label><input id="rname" placeholder="ชื่อ นามสกุล"></div><div class="field"><label>หน่วยงาน *</label><input id="rdept" placeholder="หน่วยงาน"></div><div class="field"><label>อุปกรณ์ *</label><input id="ritem" placeholder="ชื่ออุปกรณ์ / หมายเลขครุภัณฑ์"></div><div class="field"><label>ตำแหน่งที่ตั้ง</label><input id="rplace" placeholder="อาคาร/ห้อง"></div><div class="field full"><label>อาการหรือรายละเอียด *</label><textarea id="rproblem" placeholder="อธิบายอาการที่พบ"></textarea></div><div class="field full"><label>ภาพประกอบ (ถ้ามี)</label><input type="file" id="rfile"><small>ต้นแบบนี้ยังไม่อัปโหลดไฟล์ขึ้นระบบจริง</small></div></div><div class="formactions"><button class="btn primary" onclick="addRepair()">ส่งแจ้งซ่อม</button></div></div><div class="panel hidden" id="repairList"><div class="panelhead"><h2>รายการติดตามงานซ่อม</h2><span class="hint">ผู้รับผิดชอบอัปเดตสถานะ</span></div><div class="tablewrap"><table><thead><tr><th>อุปกรณ์</th><th>ผู้แจ้ง</th><th>วันที่รับแจ้ง</th><th>สถานะ</th><th>รายงานผล</th></tr></thead><tbody>${repairRows.map((x,i)=>`<tr><td>${esc(x.item)}<br><span class="muted">${esc(x.problem)}</span></td><td>${esc(x.name)}</td><td>${esc(x.date)}</td><td><select onchange="repairRows[${i}].status=this.value;toast('อัปเดตสถานะแล้ว')"><option>รับเรื่อง</option><option>กำลังดำเนินการ</option><option>รออะไหล่/ผู้รับจ้าง</option><option>เสร็จแล้ว</option></select></td><td><label class="btn">แนบไฟล์<input type="file" hidden onchange="toast('แนบไฟล์ในหน้าจอตัวอย่างแล้ว')"></label></td></tr>`).join('')||'<tr><td colspan="5" class="empty">ยังไม่มีรายการแจ้งซ่อมใหม่</td></tr>'}</tbody></table></div></div>`}
function services(){return `${heading('บริการและคำปรึกษา','บันทึกช่องทาง ณ สถานที่หรือออนไลน์ พร้อมผลการให้บริการ')}<div class="layout"><div class="panel"><div class="panelhead"><h2>บันทึกการรับบริการ</h2></div><div class="formgrid"><div class="field"><label>วันที่รับบริการ *</label><input id="sdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>ช่องทาง *</label><select id="smode"><option>ณ สถานที่</option><option>ออนไลน์</option></select></div><div class="field"><label>ประเภทบริการ *</label><input id="stype" placeholder="บริการ/คำปรึกษาเรื่องใด"></div><div class="field"><label>จำนวนผู้รับบริการ</label><input id="scount" type="number" min="1" value="1"></div><div class="field full"><label>สรุปผลโดยย่อ</label><textarea id="sresult" placeholder="บันทึกผลโดยไม่ใส่ข้อมูลส่วนบุคคลเกินจำเป็น"></textarea></div><div class="field"><label>ผู้บันทึก</label><input id="sclerk" placeholder="ชื่อผู้บันทึก"></div></div><div class="formactions"><button class="btn primary" onclick="addService()">บันทึกรายการ</button></div></div><div class="panel"><div class="panelhead"><h2>สถานะประจำเดือน</h2></div><div class="safe">✓ หากตรวจแล้วไม่มีผู้มารับบริการ ให้ยืนยัน “ไม่มีรายการ” ในขั้นตอนปิดเดือน</div><div class="checkrow"><span>รายการรับบริการ</span><b>${serviceRows.length||sample.service}</b></div><div class="checkrow"><span>ณ สถานที่</span><b>${serviceRows.length?serviceRows.filter(x=>x.mode==='ณ สถานที่').length:sample.onsite}</b></div><div class="checkrow"><span>ออนไลน์</span><b>${serviceRows.length?serviceRows.filter(x=>x.mode==='ออนไลน์').length:sample.online}</b></div></div></div><div class="panel"><div class="panelhead"><h2>รายการที่บันทึกล่าสุด</h2></div><div class="tablewrap"><table><thead><tr><th>วันที่</th><th>ช่องทาง</th><th>ประเภท</th><th>จำนวน</th><th>ผู้บันทึก</th></tr></thead><tbody>${serviceRows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.mode)}</td><td>${esc(x.type)}</td><td>${esc(x.count)}</td><td>${esc(x.clerk)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">แสดงรายการตัวอย่างในภาพรวม</td></tr>'}</tbody></table></div></div>`}
function travel(){return `${heading('ไปราชการ','บันทึกแผนการเดินทางและติดตามสถานะการอนุมัติ')}<div class="panel"><div class="panelhead"><h2>เพิ่มรายการไปราชการ</h2><span class="hint">กรอกข้อมูลการเดินทางของบุคลากร</span></div><div class="formgrid"><div class="field"><label>ชื่อผู้เดินทาง *</label><input id="travelName" placeholder="ชื่อ นามสกุล"></div><div class="field"><label>หน่วยงาน/ฝ่าย *</label><input id="travelDept" placeholder="หน่วยงาน"></div><div class="field"><label>วันที่ออกเดินทาง *</label><input id="travelStart" type="date"></div><div class="field"><label>วันที่กลับ *</label><input id="travelEnd" type="date"></div><div class="field"><label>จุดหมาย/สถานที่ *</label><input id="travelPlace" placeholder="จังหวัด/หน่วยงานปลายทาง"></div><div class="field"><label>ประเภทการเดินทาง</label><select id="travelType"><option>ประชุม</option><option>อบรม/สัมมนา</option><option>ปฏิบัติราชการ</option><option>ติดต่อประสานงาน</option><option>อื่น ๆ</option></select></div><div class="field full"><label>วัตถุประสงค์ *</label><textarea id="travelPurpose" placeholder="ระบุวัตถุประสงค์การเดินทาง"></textarea></div><div class="field"><label>ผู้อนุมัติ</label><input id="travelApprover" placeholder="ชื่อผู้อนุมัติ (ถ้ามี)"></div></div><div class="formactions"><button class="btn primary" onclick="addTravel()">บันทึกรายการ</button></div></div><div class="panel"><div class="panelhead"><h2>รายการไปราชการ</h2><span class="hint">${travelRows.length} รายการ</span></div><div class="tablewrap"><table><thead><tr><th>ผู้เดินทาง</th><th>หน่วยงาน</th><th>วันที่เดินทาง</th><th>จุดหมาย</th><th>ประเภท</th><th>ผู้อนุมัติ</th><th>สถานะ</th></tr></thead><tbody>${travelRows.map((t,i)=>`<tr><td>${esc(t.name)}</td><td>${esc(t.dept)}</td><td>${esc(t.start)} ถึง ${esc(t.end)}</td><td>${esc(t.place)}</td><td>${esc(t.type)}</td><td>${esc(t.approver||'—')}</td><td><select onchange="travelRows[${i}].status=this.value"><option ${t.status==='รออนุมัติ'?'selected':''}>รออนุมัติ</option><option ${t.status==='อนุมัติแล้ว'?'selected':''}>อนุมัติแล้ว</option><option ${t.status==='เสร็จสิ้น'?'selected':''}>เสร็จสิ้น</option><option ${t.status==='ยกเลิก'?'selected':''}>ยกเลิก</option></select></td></tr>`).join('')||'<tr><td colspan="7" class="empty">ยังไม่มีรายการไปราชการ</td></tr>'}</tbody></table></div></div>`}
function addTravel(){const name=val('travelName'),dept=val('travelDept'),start=val('travelStart'),end=val('travelEnd'),place=val('travelPlace'),purpose=val('travelPurpose');if(!name||!dept||!start||!end||!place||!purpose)return toast('กรุณากรอกข้อมูลที่มีเครื่องหมาย *');if(end<start)return toast('วันที่กลับต้องไม่ก่อนวันเดินทาง');travelRows.unshift({name,dept,start,end,place,type:val('travelType'),purpose,approver:val('travelApprover'),status:'รออนุมัติ'});toast('เพิ่มรายการไปราชการแล้ว');render()}
function dutySchedule(){const rows=dutyRows.filter(d=>d.date.startsWith(selectedMonth));return `${heading('ตารางลำดับเวร','จัดเวรตามกิจกรรมและจำนวนผู้ปฏิบัติงานที่หน่วยงานกำหนด',monthPicker())}<div class="notice">วางรายชื่อบุคลากรหนึ่งชื่อต่อหนึ่งบรรทัด ระบบจะจัดลำดับหมุนเวียนและเลือกจำนวนคนตามที่กำหนดในแต่ละกิจกรรม</div><div class="layout"><section><div class="panel"><div class="panelhead"><h2>รายชื่อผู้ปฏิบัติงาน</h2><span class="hint">${dutyRoster.length} รายชื่อ</span></div><div class="field"><label>รายชื่อบุคลากร (หนึ่งบรรทัดต่อชื่อ)</label><textarea id="dutyRosterInput" placeholder="วางรายชื่อที่ส่งไว้ เช่น\nชื่อ นามสกุล\nชื่อ นามสกุล">${esc(dutyRoster.join('\n'))}</textarea></div><div class="formactions"><button class="btn primary" onclick="saveDutyRoster()">บันทึกรายชื่อ</button></div></div><div class="panel"><div class="panelhead"><h2>เพิ่มกิจกรรมและจัดลำดับเวร</h2></div><div class="formgrid"><div class="field"><label>วันที่จัดกิจกรรม *</label><input id="dutyDate" type="date"></div><div class="field"><label>กิจกรรม *</label><select id="dutyType"><option>การตักบาตร</option><option>การฟังเทศน์</option><option>การเข้าเฝ้า</option><option>การเข้าร่วมงาน</option><option>อื่น ๆ</option></select></div><div class="field"><label>จำนวนผู้ปฏิบัติงานที่ต้องการ *</label><input id="dutyCount" type="number" min="1" value="1"></div><div class="field"><label>สถานที่/รายละเอียด</label><input id="dutyPlace" placeholder="สถานที่หรือหมายเหตุ"></div></div><div class="formactions"><button class="btn primary" onclick="assignDuty()">จัดลำดับและบันทึกเวร</button></div></div></section><aside><div class="panel"><div class="panelhead"><h2>สรุปเดือนนี้</h2></div><div class="checkrow"><span>กิจกรรมทั้งหมด</span><b>${rows.length}</b></div><div class="checkrow"><span>คน-เวรที่จัดแล้ว</span><b>${rows.reduce((n,r)=>n+r.people.length,0)}</b></div><div class="checkrow"><span>รายชื่อในรอบเวร</span><b>${dutyRoster.length}</b></div><div class="safe" style="margin-top:14px">ระบบหมุนเวียนต่อจากรายชื่อคนสุดท้ายที่ได้รับเวรก่อนหน้าในข้อมูลปัจจุบัน</div></div></aside></div><div class="panel"><div class="panelhead"><h2>ตารางเวรประจำเดือน</h2><span class="hint">${monthLabel()}</span></div><div class="tablewrap"><table><thead><tr><th>วันที่</th><th>กิจกรรม</th><th>สถานที่/รายละเอียด</th><th>จำนวนคน</th><th>รายชื่อผู้ปฏิบัติงาน</th><th>สถานะ</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${esc(r.date)}</td><td>${esc(r.type)}</td><td>${esc(r.place||'—')}</td><td>${r.people.length}</td><td>${r.people.map(esc).join('<br>')}</td><td><button class="btn ${r.done?'':'primary'}" onclick="toggleDuty('${esc(r.id)}')">${r.done?'เสร็จแล้ว':'ทำเครื่องหมายเสร็จ'}</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">เดือนนี้ยังไม่มีตารางเวร</td></tr>'}</tbody></table></div></div>`}
function saveDutyRoster(){const names=(document.querySelector('#dutyRosterInput')?.value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);dutyRoster=[...new Set(names)];dutyCursor=dutyRoster.length?dutyCursor%dutyRoster.length:0;toast(`บันทึกรายชื่อ ${dutyRoster.length} คนแล้ว`);render()}
function assignDuty(){const date=val('dutyDate'),count=Number(val('dutyCount')),place=val('dutyPlace');if(!dutyRoster.length)return toast('กรุณาวางและบันทึกรายชื่อก่อน');if(!date||!count)return toast('กรุณาระบุวันที่และจำนวนคน');if(count>dutyRoster.length)return toast('จำนวนคนที่ต้องการมากกว่ารายชื่อในระบบ');const people=[];for(let i=0;i<count;i++)people.push(dutyRoster[(dutyCursor+i)%dutyRoster.length]);dutyCursor=(dutyCursor+count)%dutyRoster.length;dutyRows.push({id:'DUTY-'+Date.now(),date,type:val('dutyType'),place,people,done:false});selectedMonth=date.slice(0,7);toast('จัดลำดับเวรแล้ว');render()}
function toggleDuty(id){const r=dutyRows.find(x=>x.id===id);if(r){r.done=!r.done;render()}}
function enhanceDutyPage(){if(page!=='duties'||document.querySelector('#dutyCalendarPanel'))return;const panels=document.querySelectorAll('#content .panel');if(!panels.length)return;const list=panels[panels.length-1];list.id='dutyListPanel';list.classList.toggle('hidden',dutyView!=='list');const [year,month]=selectedMonth.split('-').map(Number),firstOffset=new Date(year,month-1,1).getDay(),days=new Date(year,month,0).getDate(),weeks=Math.ceil((firstOffset+days)/7),weekday=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];let cells=weekday.map(x=>`<div class="cal-head">${x}</div>`).join('');for(let i=0;i<weeks*7;i++){const day=i-firstOffset+1;if(day<1||day>days){cells+='<div class="cal-day off"></div>';continue}const key=`${selectedMonth}-${String(day).padStart(2,'0')}`,events=dutyRows.filter(r=>r.date===key);cells+=`<div class="cal-day"><div class="cal-num">${day}</div>${events.map(r=>`<div class="cal-event"><b>${esc(r.type)}${r.done?' · เสร็จแล้ว':''}</b><div>${r.people.map(esc).join('、')}</div>${r.place?`<small>${esc(r.place)}</small>`:''}</div>`).join('')}</div>`}const cal=document.createElement('div');cal.className=`panel${dutyView==='list'?' hidden':''}`;cal.id='dutyCalendarPanel';cal.innerHTML=`<div class="panelhead"><h2>ปฏิทินเวร · ${monthLabel()}</h2><div class="calendar-tools"><button class="tab ${dutyView==='calendar'?'active':''}" onclick="dutyView='calendar';render()">ปฏิทิน</button><button class="tab ${dutyView==='list'?'active':''}" onclick="dutyView='list';render()">รายการ</button></div></div><div class="calendar-grid">${cells}</div>`;list.parentNode.insertBefore(cal,list)}
function bookRegister(){const rows=bookRows.filter(b=>b.date.startsWith(selectedMonth)),received=rows.filter(b=>b.direction==='รับเข้า').length,sent=rows.filter(b=>b.direction==='ส่งออก').length;return `${heading('ทะเบียนหนังสือรับ–ส่ง','กลุ่มพัฒนาระบบบริหาร สป. · สรุปจำนวนหนังสือแยกกลุ่มและเดือน',monthPicker())}<div class="cards"><div class="card"><div class="cardtop">หนังสือรับเข้า<span class="cardicon">↓</span></div><div class="number">${received}</div><div class="sub">รายการในเดือน ${monthLabel()}</div></div><div class="card"><div class="cardtop">หนังสือส่งออก<span class="cardicon">↑</span></div><div class="number">${sent}</div><div class="sub">รายการในเดือน ${monthLabel()}</div></div><div class="card"><div class="cardtop">ทะเบียนหนังสือทั้งหมด<span class="cardicon">▤</span></div><div class="number">${rows.length}</div><div class="sub">รับเข้าและส่งออกรวมกัน</div></div></div><div class="panel"><div class="panelhead"><h2>เพิ่มทะเบียนหนังสือ</h2><span class="hint">หนึ่งรายการต่อหนังสือหนึ่งฉบับ</span></div><div class="formgrid"><div class="field"><label>ประเภททะเบียน *</label><select id="bookDirection"><option value="รับเข้า">หนังสือรับเข้า</option><option value="ส่งออก">หนังสือส่งออก</option></select></div><div class="field"><label>เลขทะเบียนหนังสือ *</label><input id="bookNo" placeholder="เลขรับ/เลขส่ง"></div><div class="field"><label>วันที่ลงทะเบียน *</label><input id="bookDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>กลุ่มงานเจ้าของเรื่อง *</label><select id="bookGroup">${workGroups.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div><div class="field"><label>เลขที่หนังสืออ้างอิง</label><input id="bookRef" placeholder="เลขที่/ลงวันที่หนังสือ"></div><div class="field"><label>จาก / ถึง</label><input id="bookFromTo" placeholder="หน่วยงานต้นทางหรือปลายทาง"></div><div class="field full"><label>เรื่องโดยย่อ *</label><input id="bookSubject" placeholder="บันทึกชื่อเรื่องเพื่อค้นหา"></div></div><div class="formactions"><button class="btn primary" onclick="addBook()">บันทึกทะเบียน</button></div></div><div class="panel"><div class="panelhead"><h2>จำนวนหนังสือแยกตามกลุ่มงาน</h2><span class="hint">${monthLabel()}</span></div><div class="tablewrap"><table><thead><tr><th>กลุ่มงาน</th><th>รับเข้า</th><th>ส่งออก</th><th>รวม</th></tr></thead><tbody>${workGroups.map(g=>{const r=rows.filter(b=>b.group===g&&b.direction==='รับเข้า').length,s=rows.filter(b=>b.group===g&&b.direction==='ส่งออก').length;return `<tr><td>${esc(g)}</td><td>${r}</td><td>${s}</td><td>${r+s}</td></tr>`}).join('')}</tbody></table></div></div><div class="panel"><div class="panelhead"><h2>รายการทะเบียนประจำเดือน</h2><div class="toolbar"><select id="bookTypeFilter"><option value="all">รับและส่งทั้งหมด</option><option>รับเข้า</option><option>ส่งออก</option></select></div></div><div class="tablewrap"><table><thead><tr><th>เลขทะเบียน</th><th>วันที่</th><th>รับ/ส่ง</th><th>กลุ่มงาน</th><th>เลขที่หนังสือ</th><th>จาก/ถึง</th><th>เรื่อง</th></tr></thead><tbody>${rows.map(b=>`<tr><td>${esc(b.no)}</td><td>${esc(b.date)}</td><td>${statusPill(b.direction,b.direction==='รับเข้า'?'blue':'green')}</td><td>${esc(b.group)}</td><td>${esc(b.ref||'—')}</td><td>${esc(b.fromTo||'—')}</td><td>${esc(b.subject)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">เดือนนี้ยังไม่มีรายการทะเบียนหนังสือ</td></tr>'}</tbody></table></div></div>`}
function addBook(){const no=val('bookNo'),date=val('bookDate'),group=val('bookGroup'),subject=val('bookSubject');if(!no||!date||!group||!subject)return toast('กรุณากรอกเลขทะเบียน วันที่ กลุ่มงาน และเรื่อง');if(bookRows.some(b=>b.no===no))return toast('เลขทะเบียนนี้มีแล้ว');bookRows.unshift({no,date,direction:val('bookDirection'),group,ref:val('bookRef'),fromTo:val('bookFromTo'),subject});toast('บันทึกทะเบียนหนังสือแล้ว');selectedMonth=date.slice(0,7);render()}
function assetState(a){if(a.status==='ส่งซ่อม')return 'ส่งซ่อม';return equipmentLoans.some(l=>l.assetId===a.id&&!l.returnedOn)?'กำลังถูกยืม':'พร้อมใช้งาน'}
function equipment(){const available=assetItems.filter(a=>assetState(a)==='พร้อมใช้งาน');return `${heading('ยืม–คืนครุภัณฑ์','บันทึกการยืม กำหนดวันคืน และติดตามรายการที่ยังไม่คืน')}<div class="layout"><section><div class="panel"><div class="panelhead"><h2>ทำรายการยืมครุภัณฑ์</h2><span class="hint">เลือกจากรายการที่พร้อมใช้งาน</span></div><div class="formgrid"><div class="field"><label>ครุภัณฑ์ *</label><select id="loanAsset"><option value="">เลือกรายการ</option>${available.map(a=>`<option value="${esc(a.id)}">${esc(a.id)} · ${esc(a.name)} (${esc(a.location)})</option>`).join('')}</select></div><div class="field"><label>ชื่อผู้ยืม *</label><input id="loanName" placeholder="ชื่อ นามสกุล"></div><div class="field"><label>หน่วยงาน *</label><input id="loanDept" placeholder="หน่วยงาน/ฝ่าย"></div><div class="field"><label>วันที่ยืม *</label><input id="loanDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>กำหนดคืน *</label><input id="loanDue" type="date"></div><div class="field full"><label>วัตถุประสงค์</label><textarea id="loanPurpose" placeholder="ระบุการนำไปใช้งาน"></textarea></div></div><div class="formactions"><button class="btn primary" onclick="addLoan()">บันทึกการยืม</button></div></div></section><aside><div class="panel"><div class="panelhead"><h2>สรุปสถานะครุภัณฑ์</h2></div><div class="checkrow"><span>ครุภัณฑ์ทั้งหมด</span><b>${assetItems.length}</b></div><div class="checkrow"><span>พร้อมใช้งาน</span><b>${assetItems.filter(a=>assetState(a)==='พร้อมใช้งาน').length}</b></div><div class="checkrow"><span>กำลังถูกยืม</span><b>${assetItems.filter(a=>assetState(a)==='กำลังถูกยืม').length}</b></div><div class="checkrow"><span>ส่งซ่อม</span><b>${assetItems.filter(a=>assetState(a)==='ส่งซ่อม').length}</b></div></div></aside></div><div class="panel"><div class="panelhead"><h2>รายการยืม–คืน</h2><div class="toolbar"><select id="loanFilter"><option value="all">ทุกสถานะ</option><option>กำลังยืม</option><option>คืนแล้ว</option><option>เกินกำหนด</option></select></div></div><div class="tablewrap"><table><thead><tr><th>รหัส/ครุภัณฑ์</th><th>ผู้ยืม</th><th>หน่วยงาน</th><th>วันที่ยืม</th><th>กำหนดคืน</th><th>วันที่คืน</th><th>สถานะ</th><th>ดำเนินการ</th></tr></thead><tbody>${[...equipmentLoans].reverse().map(l=>{const a=assetItems.find(x=>x.id===l.assetId)||{name:'ไม่พบครุภัณฑ์'};const overdue=!l.returnedOn&&l.dueDate<new Date().toISOString().slice(0,10);return `<tr><td>${esc(l.assetId)}<br>${esc(a.name)}</td><td>${esc(l.borrower)}</td><td>${esc(l.dept)}</td><td>${esc(l.loanDate)}</td><td>${esc(l.dueDate)}</td><td>${esc(l.returnedOn||'—')}</td><td>${statusPill(l.returnedOn?'คืนแล้ว':overdue?'เกินกำหนด':'กำลังยืม',l.returnedOn?'green':overdue?'red':'amber')}</td><td>${l.returnedOn?'—':`<button class="btn" onclick="returnLoan('${esc(l.id)}')">บันทึกคืน</button>`}</td></tr>`}).join('')}</tbody></table></div></div>`}
function addLoan(){const assetId=val('loanAsset'),borrower=val('loanName'),dept=val('loanDept'),loanDate=val('loanDate'),dueDate=val('loanDue');if(!assetId||!borrower||!dept||!loanDate||!dueDate)return toast('กรุณากรอกครุภัณฑ์ ผู้ยืม หน่วยงาน และวันที่');if(dueDate<loanDate)return toast('กำหนดคืนต้องไม่ก่อนวันที่ยืม');const id='LN-'+String(equipmentLoans.length+1).padStart(3,'0');equipmentLoans.push({id,assetId,borrower,dept,loanDate,dueDate,returnedOn:''});toast('บันทึกการยืมแล้ว');render()}
function returnLoan(id){const l=equipmentLoans.find(x=>x.id===id);if(!l||l.returnedOn)return;l.returnedOn=new Date().toISOString().slice(0,10);toast('บันทึกคืนครุภัณฑ์แล้ว');render()}
function assetDep(a){const cost=Number(a.price)||0,residual=Number(a.salvage)||0,life=Math.max(1,Number(a.life)||5),annual=Math.max(0,(cost-residual)/life),elapsed=Math.max(0,Math.min(life,new Date().getFullYear()+543-(Number(a.year)||new Date().getFullYear()+543)+1)),accumulated=Math.min(Math.max(0,cost-residual),annual*elapsed);return {annual,accumulated,book:Math.max(residual,cost-accumulated)}}
function money(n){return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}
function assetReport(){const total=assetItems.length,borrowed=assetItems.filter(a=>assetState(a)==='กำลังถูกยืม').length,repair=assetItems.filter(a=>assetState(a)==='ส่งซ่อม').length;return `${heading('รายงานครุภัณฑ์','ทะเบียนครุภัณฑ์และค่าเสื่อมราคาแบบเส้นตรง',`<button class="btn primary" onclick="exportAssets()">ดาวน์โหลดรายงาน CSV</button>`)}<div class="notice">ค่าเริ่มต้นคำนวณแบบเส้นตรง อายุใช้งาน 5 ปี มูลค่าคงเหลือ 0 บาท คิดค่าเสื่อมเต็มปีตั้งแต่ปีที่ได้รับ สามารถกำหนดอายุใช้งานและมูลค่าคงเหลือให้ตรงกับบัญชีของหน่วยงานได้</div><div class="panel"><div class="panelhead"><h2>เพิ่มทะเบียนครุภัณฑ์</h2><span class="hint">ค่าเสื่อมต่อปีจะแสดงทันทีเมื่อกรอกราคา</span></div><div class="formgrid"><div class="field"><label>เลขครุภัณฑ์ *</label><input id="assetCode" placeholder="เช่น กพร-2569-001"></div><div class="field"><label>ปีที่ได้รับ (พ.ศ.) *</label><input id="assetYear" type="number" min="2400" max="2700" value="${new Date().getFullYear()+543}"></div><div class="field"><label>ชื่อครุภัณฑ์ *</label><input id="assetName" placeholder="ชื่อรายการ"></div><div class="field"><label>ประเภท</label><input id="assetCategory" placeholder="เช่น คอมพิวเตอร์"></div><div class="field"><label>รุ่น</label><input id="assetModel" placeholder="รุ่น/แบบ"></div><div class="field"><label>ยี่ห้อ</label><input id="assetBrand" placeholder="ยี่ห้อ"></div><div class="field"><label>ราคา (บาท) *</label><input id="assetPrice" type="number" min="0" step="0.01" placeholder="0"></div><div class="field"><label>อายุใช้งาน (ปี)</label><input id="assetLife" type="number" min="1" value="5"></div><div class="field"><label>มูลค่าคงเหลือ/มูลค่าซาก (บาท)</label><input id="assetSalvage" type="number" min="0" value="0"></div><div class="field"><label>ที่ตั้ง/หน่วยงาน</label><input id="assetLocation" placeholder="อาคาร/ห้อง/ฝ่าย"></div><div class="field full"><div class="safe" id="assetDepPreview">กรอกราคาเพื่อคำนวณค่าเสื่อมต่อปี</div></div></div><div class="formactions"><button class="btn primary" onclick="addAsset()">เพิ่มครุภัณฑ์</button></div></div><div class="cards"><div class="card"><div class="cardtop">ครุภัณฑ์ทั้งหมด<span class="cardicon">▧</span></div><div class="number">${total}</div><div class="sub">รายการในทะเบียน</div></div><div class="card"><div class="cardtop">พร้อมใช้งาน<span class="cardicon">✓</span></div><div class="number">${total-borrowed-repair}</div><div class="sub">อยู่ในหน่วยงาน</div></div><div class="card"><div class="cardtop">กำลังถูกยืม<span class="cardicon">⇄</span></div><div class="number">${borrowed}</div><div class="sub">ยังไม่บันทึกคืน</div></div><div class="card"><div class="cardtop">ส่งซ่อม<span class="cardicon">⚒</span></div><div class="number">${repair}</div><div class="sub">รอติดตามผล</div></div></div><div class="panel"><div class="panelhead"><h2>ทะเบียนและรายงานครุภัณฑ์</h2><div class="toolbar"><input id="assetSearch" placeholder="ค้นหาเลขหรือชื่อครุภัณฑ์"><select id="assetStatus"><option value="all">ทุกสถานะ</option><option>พร้อมใช้งาน</option><option>กำลังถูกยืม</option><option>ส่งซ่อม</option></select></div></div><div class="tablewrap"><table><thead><tr><th>เลขครุภัณฑ์</th><th>ปีที่ได้รับ</th><th>ชื่อครุภัณฑ์</th><th>รุ่น</th><th>ยี่ห้อ</th><th>ราคา</th><th>ค่าเสื่อม/ปี</th><th>ค่าเสื่อมสะสม</th><th>มูลค่าตามบัญชี</th><th>ที่ตั้ง</th><th>สถานะ</th></tr></thead><tbody id="assetRows">${assetItems.map(assetRow).join('')}</tbody></table></div></div>`}
function assetRow(a){const d=assetDep(a),loan=equipmentLoans.find(l=>l.assetId===a.id&&!l.returnedOn),state=assetState(a);return `<tr><td>${esc(a.code||a.id)}</td><td>${esc(a.year||'—')}</td><td>${esc(a.name)}</td><td>${esc(a.model||'—')}</td><td>${esc(a.brand||'—')}</td><td>${money(a.price)}</td><td>${money(d.annual)}</td><td>${money(d.accumulated)}</td><td>${money(d.book)}</td><td>${esc(a.location)}</td><td>${statusPill(state,state==='พร้อมใช้งาน'?'green':state==='ส่งซ่อม'?'red':'amber')}${loan?`<br><small>${esc(loan.borrower)} · คืน ${esc(loan.dueDate)}</small>`:''}</td></tr>`}
function filterAssets(){const q=(document.querySelector('#assetSearch')?.value||'').toLowerCase(),status=document.querySelector('#assetStatus')?.value||'all';const rows=assetItems.filter(a=>(status==='all'||assetState(a)===status)&&(`${a.id} ${a.code} ${a.name} ${a.model} ${a.brand} ${a.category} ${a.location}`).toLowerCase().includes(q));document.querySelector('#assetRows').innerHTML=rows.map(assetRow).join('')||'<tr><td colspan="11" class="empty">ไม่พบรายการตามเงื่อนไข</td></tr>'}
function previewAssetDep(){const cost=Number(document.querySelector('#assetPrice')?.value)||0,life=Math.max(1,Number(document.querySelector('#assetLife')?.value)||5),residual=Math.min(cost,Number(document.querySelector('#assetSalvage')?.value)||0),year=Number(document.querySelector('#assetYear')?.value)||new Date().getFullYear()+543,elapsed=Math.max(0,Math.min(life,new Date().getFullYear()+543-year+1)),annual=Math.max(0,(cost-residual)/life),accum=Math.min(cost-residual,annual*elapsed);const box=document.querySelector('#assetDepPreview');if(box)box.innerHTML=cost?`ค่าเสื่อมต่อปี <b>${money(annual)} บาท</b> · ค่าเสื่อมสะสมโดยประมาณ <b>${money(accum)} บาท</b> · มูลค่าตามบัญชี <b>${money(Math.max(residual,cost-accum))} บาท</b>`:'กรอกราคาเพื่อคำนวณค่าเสื่อมต่อปี'}
function addAsset(){const code=val('assetCode'),name=val('assetName'),price=Number(val('assetPrice')),year=Number(val('assetYear')),life=Number(val('assetLife'))||5,salvage=Number(val('assetSalvage'))||0;if(!code||!name||!price||!year)return toast('กรุณากรอกเลขครุภัณฑ์ ชื่อ ปีที่ได้รับ และราคา');if(assetItems.some(a=>(a.code||a.id).toLowerCase()===code.toLowerCase()))return toast('เลขครุภัณฑ์นี้มีอยู่แล้ว');if(salvage>price)return toast('มูลค่าคงเหลือต้องไม่สูงกว่าราคา');assetItems.unshift({id:'EQ-'+String(assetItems.length+1).padStart(3,'0'),code,year,name,category:val('assetCategory'),model:val('assetModel'),brand:val('assetBrand'),price,life,salvage,location:val('assetLocation'),status:'พร้อมใช้งาน'});toast('เพิ่มทะเบียนครุภัณฑ์แล้ว');render()}
function exportAssets(){const rows=[['เลขครุภัณฑ์','ปีที่ได้รับ (พ.ศ.)','ชื่อครุภัณฑ์','ประเภท','รุ่น','ยี่ห้อ','ราคา','ค่าเสื่อมต่อปี','ค่าเสื่อมสะสม','มูลค่าตามบัญชี','อายุใช้งาน (ปี)','มูลค่าคงเหลือ','ที่ตั้ง','สถานะ'],...assetItems.map(a=>{const d=assetDep(a);return [a.code||a.id,a.year,a.name,a.category,a.model,a.brand,a.price,d.annual,d.accumulated,d.book,a.life,a.salvage,a.location,assetState(a)]})];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download='รายงานครุภัณฑ์.csv';link.click();URL.revokeObjectURL(link.href)}
function restricted(type){const isLeave=type==='leave',title=isLeave?'บันทึกการลา':'ร้องเรียน/ร้องทุกข์';if(document.querySelector('#role').value!=='hr'){document.querySelector('#role').value='hr'}return `${heading(title,'พื้นที่ข้อมูลจำกัดสิทธิ์ · สำหรับผู้รับผิดชอบที่ได้รับมอบหมาย')}<div class="notice">ข้อมูลในหน้านี้เป็นข้อมูลส่วนบุคคล/ข้อมูลอ่อนไหว ต้นแบบนี้แสดงรูปแบบหน้าจอเท่านั้น ระบบจริงต้องยืนยันสิทธิ์จากฝั่งเซิร์ฟเวอร์ และจำกัดผู้เห็นข้อมูลเป็นรายบทบาท</div><div class="layout"><div class="panel"><div class="panelhead"><h2>${isLeave?'บันทึกข้อมูลการลา':'บันทึกเรื่องร้องเรียน'}</h2>${statusPill('เฉพาะงานบุคคล','red')}</div><div class="formgrid">${isLeave?`<div class="field"><label>ชื่อบุคลากร *</label><input placeholder="ชื่อ นามสกุล"></div><div class="field"><label>ประเภทการลา *</label><select><option>ลาป่วย</option><option>ลากิจ</option><option>พักผ่อนประจำปี</option><option>อื่น ๆ</option></select></div><div class="field"><label>วันเริ่มลา</label><input type="date"></div><div class="field"><label>วันสิ้นสุด</label><input type="date"></div><div class="field"><label>จำนวนวัน</label><input type="number" min="0.5" step="0.5"></div>`:`<div class="field"><label>วันที่รับเรื่อง *</label><input type="date"></div><div class="field"><label>ช่องทางรับเรื่อง</label><select><option>แบบฟอร์มออนไลน์</option><option>หนังสือ</option><option>โทรศัพท์/แจ้งด้วยตนเอง</option></select></div><div class="field"><label>ผู้ร้อง (ไม่บังคับ)</label><input placeholder="เว้นว่างได้ หากรับเรื่องไม่ระบุตัวตน"></div><div class="field"><label>ระดับความลับ</label><select><option>จำกัดเฉพาะผู้รับผิดชอบ</option><option>ผู้บริหารที่ได้รับมอบหมาย</option></select></div>`}<div class="field full"><label>${isLeave?'หมายเหตุสำหรับงานบุคคล':'รายละเอียดเรื่องร้องเรียน'}</label><textarea placeholder="บันทึกเท่าที่จำเป็น จำกัดการเข้าถึง"></textarea></div><div class="field full"><label>เอกสารแนบ (ถ้ามี)</label><input type="file"><small>ไฟล์แนบในระบบจริงต้องจัดเก็บในพื้นที่ที่จำกัดสิทธิ์ด้วย</small></div></div><div class="formactions"><button class="btn primary" onclick="toast('ตัวอย่างหน้าจอเท่านั้น ยังไม่ได้บันทึกข้อมูลจริง')">บันทึกข้อมูล</button></div></div><aside><div class="panel"><div class="panelhead"><h2>ยอดรวมสำหรับรายงาน</h2></div><div class="safe">รายงานหลักใช้เฉพาะจำนวนและประเภท ไม่มีชื่อหรือรายละเอียดเรื่อง</div>${isLeave?'<div class="checkrow"><span>ลาป่วย</span><b>3</b></div><div class="checkrow"><span>ลากิจ</span><b>2</b></div><div class="checkrow"><span>พักผ่อน</span><b>2</b></div>':'<div class="checkrow"><span>รับเรื่อง</span><b>1</b></div><div class="checkrow"><span>อยู่ระหว่างดำเนินการ</span><b>1</b></div><div class="checkrow"><span>ปิดเรื่องแล้ว</span><b>0</b></div>'}<button class="btn" style="width:100%;margin-top:14px" onclick="toast('ยอดรวมส่งเข้ารายงานหลักได้เมื่อปิดเดือน')">ส่งเฉพาะยอดรวมเข้ารายงาน</button></div></aside></div>`}
function render(){const titles={dashboard:'สรุปรายเดือน',materials:'เบิกวัสดุ',repairs:'แจ้งซ่อมอุปกรณ์',services:'บริการ/คำปรึกษา',equipment:'ยืม–คืนครุภัณฑ์',assetReport:'รายงานครุภัณฑ์',travel:'ไปราชการ',books:'ทะเบียนหนังสือรับ–ส่ง',duties:'ตารางลำดับเวร',leave:'บันทึกการลา',complaints:'ร้องเรียน/ร้องทุกข์'};document.querySelector('#crumb').textContent=titles[page];const v={dashboard,materials,repairs,services,equipment,assetReport,travel,books:bookRegister,duties:dutySchedule,leave:()=>restricted('leave'),complaints:()=>restricted('complaints')}[page]();document.querySelector('#content').innerHTML=v;const m=document.querySelector('#month');if(m)m.onchange=e=>{selectedMonth=e.target.value;render()};const search=document.querySelector('#assetSearch'),status=document.querySelector('#assetStatus');if(search)search.oninput=filterAssets;if(status)status.onchange=filterAssets;const loanFilter=document.querySelector('#loanFilter');if(loanFilter)loanFilter.onchange=()=>{document.querySelectorAll('#content tbody tr').forEach(r=>{const txt=r.innerText;const f=loanFilter.value;r.style.display=f==='all'||(f==='กำลังยืม'&&txt.includes('กำลังยืม'))||(f==='คืนแล้ว'&&txt.includes('คืนแล้ว'))||(f==='เกินกำหนด'&&txt.includes('เกินกำหนด'))?'':'none'})}}
function val(id){return document.getElementById(id)?.value?.trim()||''}
function addRequest(){if(!val('mname')||!val('mitem')||!val('mqty'))return toast('กรุณากรอกชื่อ รายการ และจำนวน');requestRows.unshift({name:val('mname'),item:val('mitem'),qty:val('mqty'),dept:val('mdept')});toast('รับคำขอเบิกแล้ว');materialView='list';render()}
function addMaterial(){const name=val('newMatName'),unit=val('newMatUnit');if(!name||!unit)return toast('กรุณากรอกชื่อวัสดุและหน่วยนับ');if(stockItems.some(x=>x.name.toLowerCase()===name.toLowerCase()))return toast('มีชื่อวัสดุนี้แล้ว');stockItems.push({name,unit,qty:Number(val('newMatQty')||0),min:Number(val('newMatMin')||0)});toast('เพิ่มรายการวัสดุแล้ว');render()}
function addIssue(){if(!val('iitem')||!val('iqty'))return toast('กรุณากรอกรายการและจำนวนที่จ่าย');issuedRows.unshift({date:val('idate'),item:val('iitem'),qty:val('iqty'),name:val('irecipient')||'ไม่ระบุ'});toast('บันทึกยอดจ่ายแล้ว');materialView='list';render()}
function addRepair(){if(!val('ritem')||!val('rproblem'))return toast('กรุณากรอกอุปกรณ์และอาการ');repairRows.unshift({item:val('ritem'),name:val('rname')||'ไม่ระบุ',problem:val('rproblem'),date:new Date().toLocaleDateString('th-TH'),status:'รับเรื่อง'});toast('รับแจ้งซ่อมแล้ว');render();document.querySelector('#repairForm').classList.add('hidden');document.querySelector('#repairList').classList.remove('hidden')}
function addService(){if(!val('stype'))return toast('กรุณาระบุประเภทบริการ');serviceRows.unshift({date:val('sdate'),mode:val('smode'),type:val('stype'),count:val('scount')||1,clerk:val('sclerk')||'ไม่ระบุ'});toast('บันทึกข้อมูลบริการแล้ว');render()}
const dutyObserver=new MutationObserver(()=>enhanceDutyPage());dutyObserver.observe(document.querySelector('#content'),{childList:true});
render();
</script>
</body>
